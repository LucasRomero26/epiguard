<svg width="720" viewBox="0 0 720 580" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>EpiGuard System Architecture</title>
  <desc>Four-layer architecture: GitHub Actions triggers Supabase via HTTP, Supabase fetches climate data and runs inference on Hugging Face, results served to Next.js 14 frontend.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- ── 1. GitHub Actions ── -->
  <rect x="40" y="30" width="640" height="100" rx="10" fill="#000000" stroke="#444444" stroke-width="1"/>
  <text x="360" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">GitHub Actions</text>
  <text x="360" y="86" text-anchor="middle" font-size="12" fill="#aaaaaa">Daily cron (01:00 COT) → triggers Supabase Edge Function</text>
  <text x="360" y="108" text-anchor="middle" font-size="12" fill="#aaaaaa">epiguard-cron repo</text>

  <!-- Connector: HTTP -->
  <line x1="360" y1="130" x2="360" y2="178" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="316" y="140" width="88" height="20" rx="4" fill="#111111"/>
  <text x="360" y="154" text-anchor="middle" font-size="11" fill="#888888">HTTP</text>

  <!-- ── 2. Supabase ── -->
  <rect x="40" y="178" width="640" height="108" rx="10" fill="#000000" stroke="#444444" stroke-width="1"/>
  <text x="360" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Supabase — Backend</text>
  <!-- Two pill boxes for Edge Functions -->
  <rect x="60" y="218" width="284" height="32" rx="7" fill="#111111" stroke="#333333" stroke-width="0.5"/>
  <text x="202" y="238" text-anchor="middle" font-size="12" fill="#aaaaaa">Edge Function: daily-update</text>
  <rect x="376" y="218" width="284" height="32" rx="7" fill="#111111" stroke="#333333" stroke-width="0.5"/>
  <text x="518" y="238" text-anchor="middle" font-size="12" fill="#aaaaaa">Edge Function: on-demand-predict</text>
  <text x="360" y="272" text-anchor="middle" font-size="12" fill="#888888">PostgreSQL: predictions_continuous · departments</text>

  <!-- Connector: Fetch climate -->
  <line x1="360" y1="286" x2="360" y2="338" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="196" y="295" width="328" height="22" rx="4" fill="#111111"/>
  <text x="360" y="310" text-anchor="middle" font-size="11" fill="#888888">Fetch climate (NASA POWER, NOAA) + run inference</text>

  <!-- ── 3. Hugging Face ── -->
  <rect x="40" y="338" width="640" height="108" rx="10" fill="#000000" stroke="#444444" stroke-width="1"/>
  <text x="360" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Hugging Face Space — ML inference node</text>
  <text x="360" y="392" text-anchor="middle" font-size="12" fill="#aaaaaa">32 pre-trained SARIMAX models (one per department, ~110 MB)</text>
  <text x="360" y="416" text-anchor="middle" font-size="12" fill="#aaaaaa">Returns: 4-week case forecasts + climate-variable contributions</text>

  <!-- Connector: REST API -->
  <line x1="360" y1="446" x2="360" y2="494" stroke="#555555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="306" y="455" width="108" height="20" rx="4" fill="#111111"/>
  <text x="360" y="469" text-anchor="middle" font-size="11" fill="#888888">REST API</text>

  <!-- ── 4. Next.js Frontend ── -->
  <rect x="40" y="494" width="640" height="66" rx="10" fill="#000000" stroke="#6ec6ff" stroke-width="1.5"/>
  <text x="360" y="522" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Next.js 14 Frontend — this repo</text>
  <text x="360" y="544" text-anchor="middle" font-size="12" fill="#aaaaaa">MapLibre GL choropleth · Recharts dashboards · PDF reports</text>
</svg>
